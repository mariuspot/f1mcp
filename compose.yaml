# Runs the Pit Wall chat (http://localhost:3000) with the f1mcp service it
# calls. Put ANTHROPIC_API_KEY (and OPENAI_API_KEY, to transcribe team
# radio) in a .env file next to this one.
services:
  api:
    build: .
    command: ["-transport", "http"]
    restart: unless-stopped
    environment:
      # Transcribes team radio when set; transcripts are kept in f1cache.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      F1MCP_CACHE_DIR: /cache
    volumes:
      - f1cache:/cache
    # Not published: only the web app calls it. Add "8080:8080" to use MCP
    # over HTTP from outside.
    expose: ["8080"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      F1_API_URL: http://api:8080
    ports: ["3000:3000"]

volumes:
  f1cache:
